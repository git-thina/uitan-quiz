<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ういたんの答えを選択しろ‼️</title>
<style>
  :root {
    --bg-cream: #fff9fb;
    --bg-card: #ffffff;
    --ink-main: #2d1f26;
    --ink-sub: #7a626c;
    --accent-rose: #ff4d79;
    --accent-rose-dark: #e02b5c;
    --accent-berry: #b8326a;
    --accent-gold: #f5b935;
    --accent-gold-soft: #fff6db;
    --accent-lilac: #f4ecff;
    --border-soft: #f3dce6;
    --ok-bg: #ebfaef;
    --ok-ink: #197c3c;
    --ng-bg: #fff0f4;
    --ng-ink: #c6284f;
    --shadow-card: 0 16px 40px rgba(224, 43, 92, 0.09), 0 4px 14px rgba(45, 31, 38, 0.04);
    --shadow-btn: 0 8px 22px rgba(255, 77, 121, 0.34);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    background-color: var(--bg-cream);
    background-image:
      radial-gradient(circle at 12% 14%, rgba(255, 77, 121, 0.13) 0, transparent 42%),
      radial-gradient(circle at 88% 18%, rgba(245, 185, 53, 0.16) 0, transparent 38%),
      radial-gradient(circle at 82% 86%, rgba(196, 148, 255, 0.16) 0, transparent 44%),
      radial-gradient(circle at 20% 88%, rgba(255, 158, 187, 0.15) 0, transparent 40%);
    color: var(--ink-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 22px 16px 56px;
  }

  .app-header {
    width: 100%;
    max-width: 680px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .brand-tag {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.06em;
    color: var(--accent-rose-dark);
    background: linear-gradient(135deg, #ffffff 0%, #fff0f5 100%);
    border: 1.5px solid #f7cddc;
    padding: 7px 14px;
    border-radius: 999px;
    box-shadow: 0 4px 12px rgba(255, 77, 121, 0.1);
  }

  .brand-tag.is-hidden {
    visibility: hidden;
  }

  .sound-btn {
    font-family: inherit;
    font-size: 12px;
    font-weight: 800;
    color: var(--ink-main);
    background: #fff;
    border: 1.5px solid var(--border-soft);
    padding: 7px 15px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(45, 31, 38, 0.05);
    transition: all 0.16s ease;
  }

  .sound-btn:hover {
    border-color: var(--accent-rose);
    color: var(--accent-rose-dark);
    transform: translateY(-1px);
  }

  .container {
    width: 100%;
    max-width: 680px;
    background: rgba(255, 255, 255, 0.96);
    border: 2px solid #f7dfea;
    border-radius: 28px;
    box-shadow: var(--shadow-card);
    padding: 30px 24px 36px;
    position: relative;
    overflow: hidden;
  }

  .container::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 6px;
    background: linear-gradient(90deg, #ff7aa2, #ffd166, #c792ea, #ff4d79);
  }

  @media (min-width: 600px) {
    .container {
      padding: 38px 40px 42px;
    }
  }

  .start-screen {
    text-align: center;
  }

  .badge-top {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, #fff5d6 0%, #ffe8f0 100%);
    color: #9e4767;
    border: 1.5px solid #f5cde0;
    font-size: 12px;
    font-weight: 800;
    padding: 6px 16px;
    border-radius: 999px;
    margin-bottom: 14px;
    box-shadow: 0 3px 10px rgba(255, 77, 121, 0.08);
  }

  .main-title {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: clamp(25px, 6.2vw, 38px);
    font-weight: 900;
    line-height: 1.32;
    color: var(--ink-main);
    margin-bottom: 22px;
    text-shadow: 0 2px 10px rgba(255, 77, 121, 0.08);
  }

  .rule-box {
    background: linear-gradient(180deg, #fffafd 0%, #fff4f8 100%);
    border: 2px dashed #f3b8cf;
    border-radius: 20px;
    padding: 22px 18px;
    margin-bottom: 28px;
    font-size: 15px;
    line-height: 1.95;
    color: var(--ink-main);
    font-weight: 600;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
  }

  .rule-highlight {
    display: inline-block;
    font-weight: 900;
    font-size: 17px;
    color: var(--accent-rose-dark);
    background: linear-gradient(135deg, #ffe3ec 0%, #fff0c2 100%);
    border: 1px solid #f7bfd3;
    padding: 3px 12px;
    border-radius: 10px;
    margin: 3px 0;
  }

  .primary-btn {
    font-family: inherit;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 0.05em;
    color: #fff;
    background: linear-gradient(135deg, #ff6b95 0%, var(--accent-rose) 52%, var(--accent-rose-dark) 100%);
    border: none;
    border-radius: 999px;
    padding: 16px 40px;
    cursor: pointer;
    box-shadow: var(--shadow-btn);
    transition: transform 0.14s ease, box-shadow 0.14s ease, filter 0.14s ease;
  }

  .primary-btn:hover {
    transform: translateY(-2px) scale(1.01);
    box-shadow: 0 11px 26px rgba(255, 77, 121, 0.42);
    filter: brightness(1.03);
  }

  .primary-btn:active {
    transform: translateY(0) scale(0.99);
  }

  .quiz-screen {
    display: none;
  }

  .progress-wrap {
    margin-bottom: 22px;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: 800;
    color: var(--ink-sub);
    margin-bottom: 8px;
  }

  .q-counter {
    color: var(--accent-rose-dark);
    font-size: 15px;
    background: #fff0f5;
    padding: 3px 11px;
    border-radius: 999px;
    border: 1px solid #f8cde0;
  }

  .progress-bar-bg {
    width: 100%;
    height: 10px;
    background: #f9e6ee;
    border-radius: 999px;
    overflow: hidden;
    padding: 1px;
  }

  .progress-bar-fill {
    height: 100%;
    width: 10%;
    background: linear-gradient(90deg, #ff85a8, #ffd166, #ff4d79);
    border-radius: 999px;
    transition: width 0.25s ease;
  }

  .kanji-stage {
    text-align: center;
    background: linear-gradient(160deg, #fffdfd 0%, #fff2f7 60%, #fef9e7 100%);
    border: 2px solid #f6d5e4;
    border-radius: 22px;
    padding: 30px 18px;
    margin-bottom: 22px;
    box-shadow: 0 8px 20px rgba(255, 77, 121, 0.06);
  }

  .kanji-label {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 800;
    color: #9e4767;
    background: #fff;
    border: 1px solid #f4cadc;
    padding: 3px 12px;
    border-radius: 999px;
    letter-spacing: 0.1em;
    margin-bottom: 10px;
  }

  .kanji-word {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: clamp(32px, 8vw, 48px);
    font-weight: 900;
    color: var(--ink-main);
    line-height: 1.3;
    word-break: break-word;
    text-shadow: 0 2px 8px rgba(45, 31, 38, 0.06);
  }

  .choices-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }

  @media (min-width: 520px) {
    .choices-grid {
      grid-template-columns: 1fr 1fr;
    }
  }

  .choice-btn {
    font-family: inherit;
    font-size: 16px;
    font-weight: 800;
    color: var(--ink-main);
    background: linear-gradient(180deg, #ffffff 0%, #fff9fb 100%);
    border: 2px solid #f2d4e2;
    border-radius: 18px;
    padding: 16px 14px;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 4px 12px rgba(255, 77, 121, 0.06);
    transition: all 0.15s ease;
    min-height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.4;
  }

  .choice-btn:hover:not(:disabled) {
    border-color: var(--accent-rose);
    background: linear-gradient(180deg, #fff5f8 0%, #ffe9f0 100%);
    color: var(--accent-rose-dark);
    transform: translateY(-2px);
    box-shadow: 0 7px 16px rgba(255, 77, 121, 0.16);
  }

  .choice-btn.selected {
    border-color: var(--accent-rose-dark);
    background: linear-gradient(135deg, #ff6b95 0%, var(--accent-rose-dark) 100%);
    color: #fff;
    box-shadow: 0 8px 18px rgba(224, 43, 92, 0.3);
  }

  .result-screen {
    display: none;
  }

  .score-box {
    text-align: center;
    border-radius: 22px;
    padding: 28px 18px;
    margin-bottom: 26px;
  }

  .score-box.tier-100 {
    background: linear-gradient(135deg, #fff7d1 0%, #ffe3f0 48%, #ffd257 100%);
    border: 2.5px solid #e2a21b;
    box-shadow: 0 12px 28px rgba(226, 162, 27, 0.34);
  }

  .score-box.tier-80 {
    background: linear-gradient(160deg, #fffaf0 0%, #fff0f6 55%, #fde8b2 100%);
    border: 2px solid #e5a935;
    box-shadow: 0 9px 22px rgba(229, 169, 53, 0.2);
  }

  .score-box.tier-60 {
    background: linear-gradient(180deg, #fffdfd 0%, #f9f0f5 100%);
    border: 1.5px solid #e3c8d6;
  }

  .score-box.tier-40 {
    background: linear-gradient(180deg, #fff7fa 0%, #fce8ef 100%);
    border: 1.5px solid #eab3c6;
  }

  .score-box.tier-20 {
    background: linear-gradient(180deg, #fff0f4 0%, #fad8e2 100%);
    border: 2px solid #e289a6;
  }

  .score-box.tier-0 {
    background: linear-gradient(180deg, #f5eff3 0%, #e7dce3 100%);
    border: 2px solid #9c8894;
  }

  .tier-badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0.06em;
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 8px;
  }

  .tier-100 .tier-badge { background: #9c5700; color: #fff8dc; }
  .tier-80 .tier-badge { background: #a8542a; color: #fff; }
  .tier-60 .tier-badge { background: #6d5362; color: #fff; }
  .tier-40 .tier-badge { background: #c23561; color: #fff; }
  .tier-20 .tier-badge { background: #a31f49; color: #fff; }
  .tier-0 .tier-badge { background: #382a33; color: #f7f2f5; }

  .score-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-sub);
    margin-bottom: 4px;
  }

  .score-value {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-weight: 900;
    color: var(--accent-rose-dark);
    line-height: 1.2;
  }

  .tier-100 .score-value { font-size: clamp(46px, 12vw, 66px); color: #c91d4e; }
  .tier-80 .score-value { font-size: clamp(42px, 10.5vw, 58px); color: var(--accent-rose-dark); }
  .tier-60 .score-value, .tier-40 .score-value { font-size: clamp(38px, 9.5vw, 52px); }
  .tier-20 .score-value { font-size: clamp(36px, 9vw, 48px); color: #ad1c4a; }
  .tier-0 .score-value { font-size: clamp(36px, 9vw, 48px); color: #564550; }

  .score-unit {
    font-size: 20px;
    font-weight: 700;
    color: var(--ink-main);
    margin-left: 4px;
  }

  .rank-headline {
    margin-top: 10px;
    font-weight: 900;
    color: var(--ink-main);
    line-height: 1.45;
  }

  .tier-100 .rank-headline { font-size: 18px; }
  .tier-80 .rank-headline { font-size: 16px; }
  .tier-60 .rank-headline, .tier-40 .rank-headline { font-size: 15px; }
  .tier-20 .rank-headline, .tier-0 .rank-headline { font-size: 15px; color: #422430; }

  .regret-note {
    margin-top: 10px;
    font-size: 13px;
    line-height: 1.65;
    font-weight: 600;
    color: var(--ink-sub);
    background: rgba(255, 255, 255, 0.78);
    border-radius: 14px;
    padding: 11px 14px;
  }

  .result-list-title {
    font-size: 15px;
    font-weight: 900;
    color: var(--ink-main);
    margin-bottom: 12px;
    padding-left: 12px;
    border-left: 4px solid var(--accent-rose);
  }

  .result-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 28px;
  }

  .result-item {
    border: 1.5px solid #f5dce8;
    border-radius: 16px;
    padding: 14px 16px;
    background: #fff;
    box-shadow: 0 3px 10px rgba(255, 77, 121, 0.04);
  }

  .result-item.is-correct {
    border-left: 5px solid var(--ok-ink);
    background: #f9fefb;
  }

  .result-item.is-wrong {
    border-left: 5px solid var(--ng-ink);
    background: #fff9fb;
  }

  .result-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .result-kanji {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 18px;
    font-weight: 900;
    color: var(--ink-main);
  }

  .verdict-badge {
    font-size: 12px;
    font-weight: 900;
    padding: 3px 11px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .verdict-ok {
    background: var(--ok-bg);
    color: var(--ok-ink);
  }

  .verdict-ng {
    background: var(--ng-bg);
    color: var(--ng-ink);
  }

  .result-details {
    font-size: 13px;
    line-height: 1.65;
    color: var(--ink-sub);
  }

  .result-details strong {
    color: var(--ink-main);
  }

  .retry-wrap {
    text-align: center;
  }

  .share-section {
    background: linear-gradient(180deg, #fffdfd 0%, #fff5f8 100%);
    border: 1.5px solid var(--border-soft);
    border-radius: 20px;
    padding: 20px 18px;
    margin-bottom: 26px;
    text-align: center;
    box-shadow: 0 6px 16px rgba(255, 77, 121, 0.05);
  }

  .share-heading {
    font-size: 13px;
    font-weight: 800;
    color: var(--ink-sub);
    margin-bottom: 12px;
    letter-spacing: 0.04em;
  }

  .x-share-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    font-weight: 800;
    color: #ffffff;
    background: #141416;
    border: none;
    border-radius: 14px;
    padding: 15px 20px;
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(20, 20, 22, 0.2);
    transition: transform 0.14s ease, box-shadow 0.14s ease, opacity 0.14s ease;
  }

  .x-share-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 9px 20px rgba(20, 20, 22, 0.28);
    opacity: 0.96;
  }

  .x-share-btn:active {
    transform: translateY(0);
  }

  .x-mark {
    font-size: 16px;
    line-height: 1;
    font-weight: 900;
  }
</style>
</head>
<body>

<header class="app-header">
  <span class="brand-tag" id="topStartBadge">✨ 10問 × 10点 = 100点</span>
  <button type="button" class="sound-btn" id="soundToggle" aria-pressed="false">🔊 効果音：ON</button>
</header>

<main class="container">
  <section class="start-screen" id="startScreen">
    <div class="badge-top">💖 ういわ～るど 読み当てチャレンジ ✨</div>
    <h1 class="main-title">ういたんの答えを<br>選択しろ‼️</h1>
    <div class="rule-box">
      辞書通りの正しい読みではなく、<br>
      <span class="rule-highlight">「ういたんが実際に選んだ解答」</span><br>
      を当てるとポイント獲得！<br>
      ういたんの感覚、見抜ける？🪽︎
    </div>
    <button type="button" class="primary-btn" id="startBtn">ゲームスタート</button>
  </section>

  <section class="quiz-screen" id="quizScreen" aria-live="polite">
    <div class="progress-wrap">
      <div class="progress-meta">
        <span class="q-counter" id="qCounter">第 1 / 10 問</span>
        <span id="qSubLabel">✨ ういたんの解答を選ぼう</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <div class="kanji-stage">
      <div class="kanji-label">✦ お題 ✦</div>
      <div class="kanji-word" id="kanjiWord">上位陣</div>
    </div>

    <div class="choices-grid" id="choicesGrid"></div>
  </section>

  <section class="result-screen" id="resultScreen">
    <div class="score-box tier-0" id="scoreBox">
      <div class="tier-badge" id="tierBadge">評価ランク</div>
      <div class="score-label">あなたの獲得スコア</div>
      <div class="score-value"><span id="finalScore">0</span><span class="score-unit">点</span></div>
      <div class="rank-headline" id="rankHeadline"></div>
      <div class="regret-note" id="regretNote"></div>
    </div>

    <div class="share-section">
      <div class="share-heading">結果をシェア</div>
      <a class="x-share-btn" id="xShareBtn" href="#" target="_blank" rel="noopener noreferrer">
        <span class="x-mark">𝕏</span>
        <span>Xでシェア</span>
      </a>
    </div>

    <h2 class="result-list-title">全10問 結果一覧</h2>
    <div class="result-list" id="resultList"></div>

    <div class="retry-wrap">
      <button type="button" class="primary-btn" id="retryBtn">もう一度遊ぶ</button>
    </div>
  </section>
</main>

<script>
const QUIZ_DATA = [
  { kanji: "上位陣", uitan: "じょういぐん", correct: "じょういじん", w1: "かみくらじん", w2: "じょういぎん" },

  { kanji: "塩梅", uitan: "しおうめ", correct: "あんばい", w1: "えんばい", w2: "しおあんばい" },

  { kanji: "音速", uitan: "おとそく", correct: "おんそく", w1: "ねそく", w2: "おとはやい" },
  { kanji: "抗ってるの", uitan: "こおってるの", correct: "あらがってるの", w1: "こうしてるの", w2: "こばんでるの" },
  { kanji: "頭文字", uitan: "あたまもじ", correct: "かしらもじ", w1: "ずもじ", w2: "あたまじ" },
  { kanji: "千着", uitan: "ちぎ", correct: "せんちゃく", w1: "ちちゃく", w2: "せんぎ" },
  { kanji: "画鋲", uitan: "がじゅう", correct: "がびょう", w1: "えびょう", w2: "がひょう" },
  { kanji: "痕跡", uitan: "あとあと", correct: "こんせき", w1: "あとせき", w2: "こんあと" },
  { kanji: "読唇術", uitan: "どくくちびるじゅつ", correct: "どくしんじゅつ", w1: "よみくちびるじゅつ", w2: "どくくちじゅつ" },
  { kanji: "汎用", uitan: "ぼんよう", correct: "はんよう", w1: "ぼうよう", w2: "はんもち" },
  { kanji: "外反母趾", uitan: "そとはんぼしゃん", correct: "がいはんぼし", w1: "そとはんぼし", w2: "がいはんぼしゃん" },
  { kanji: "背筋", uitan: "せきん", correct: "せすじ", w1: "はいきん", w2: "せきんじ" },
  { kanji: "小鳥遊", uitan: "うぐいす", correct: "たかなし", w1: "ことりあそび", w2: "こどりゆう" },
  { kanji: "癌", uitan: "いわつぶ", correct: "がん", w1: "あん", w2: "やま" },
  { kanji: "新参者", uitan: "しんにんじゃ", correct: "しんざんもの", w1: "しんさんしゃ", w2: "あらさんもの" },
  { kanji: "現場", uitan: "げんば", correct: "げんば", w1: "げんじょう", w2: "あらば" },
  { kanji: "飯盒炊飯", uitan: "はんかますいはん", correct: "はんごうすいはん", w1: "めしがますいはん", w2: "はんごうめし" },
  { kanji: "落雷", uitan: "おちかみなり", correct: "らくらい", w1: "おちらい", w2: "らっかみな" },
  { kanji: "今時", uitan: "こんじき", correct: "いまどき", w1: "こんじ", w2: "いまとき" },
  { kanji: "師走", uitan: "しっそう", correct: "しわす", w1: "しそう", w2: "しはしり" },
  { kanji: "線状降水帯", uitan: "せんぷくこうすいたい", correct: "せんじょうこうすいたい", w1: "せんじょうふりすいたい", w2: "せんぷくふりたい" },
  { kanji: "裸足", uitan: "らぞく", correct: "はだし", w1: "らそく", w2: "はだあし" },
  { kanji: "漂流", uitan: "ひょうだく", correct: "ひょうりゅう", w1: "ただよいながれ", w2: "ひょうる" },
  { kanji: "アラブ首長国連邦", uitan: "あらぶくびながこくれんぽう", correct: "あらぶしゅちょうこくれんぽう", w1: "あらぶくびおさこくれんぽう", w2: "あらぶしゅちょうれんぽう" }
];

const TOTAL_QUESTIONS = 10;
const POINTS_PER_QUESTION = 10;

let soundEnabled = true;
let audioCtx = null;
let sessionQuestions = [];
let currentIndex = 0;
let userAnswers = [];
let isTransitioning = false;

const topStartBadge = document.getElementById("topStartBadge");
const startScreen = document.getElementById("startScreen");
const quizScreen = document.getElementById("quizScreen");
const resultScreen = document.getElementById("resultScreen");
const startBtn = document.getElementById("startBtn");
const retryBtn = document.getElementById("retryBtn");
const soundToggle = document.getElementById("soundToggle");
const qCounter = document.getElementById("qCounter");
const progressBar = document.getElementById("progressBar");
const kanjiWord = document.getElementById("kanjiWord");
const choicesGrid = document.getElementById("choicesGrid");
const scoreBox = document.getElementById("scoreBox");
const tierBadge = document.getElementById("tierBadge");
const finalScore = document.getElementById("finalScore");
const rankHeadline = document.getElementById("rankHeadline");
const regretNote = document.getElementById("regretNote");
const xShareBtn = document.getElementById("xShareBtn");
const resultList = document.getElementById("resultList");

function setTopStartBadgeVisible(visible) {
  if (!topStartBadge) return;
  topStartBadge.classList.toggle("is-hidden", !visible);
}

function playClickSound() {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(520, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(760, audioCtx.currentTime + 0.07);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
  } catch (_) {}
}

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function startGame() {
  playClickSound();
  sessionQuestions = shuffleArray(QUIZ_DATA).slice(0, TOTAL_QUESTIONS).map(item => {
    const options = shuffleArray([
      { text: item.uitan, isUitan: true },
      { text: item.correct, isUitan: false },
      { text: item.w1, isUitan: false },
      { text: item.w2, isUitan: false }
    ]);
    return {
      ...item,
      options
    };
  });
  currentIndex = 0;
  userAnswers = [];
  isTransitioning = false;

  setTopStartBadgeVisible(false);
  startScreen.style.display = "none";
  resultScreen.style.display = "none";
  quizScreen.style.display = "block";
  renderQuestion();
}

function renderQuestion() {
  const q = sessionQuestions[currentIndex];
  qCounter.textContent = `第 ${currentIndex + 1} / ${TOTAL_QUESTIONS} 問`;
  progressBar.style.width = `${((currentIndex + 1) / TOTAL_QUESTIONS) * 100}%`;
  kanjiWord.textContent = q.kanji;
  choicesGrid.innerHTML = "";

  q.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "choice-btn";
    btn.textContent = opt.text;
    btn.addEventListener("click", () => handleSelect(btn, opt));
    choicesGrid.appendChild(btn);
  });
}

function handleSelect(btn, opt) {
  if (isTransitioning) return;
  isTransitioning = true;
  playClickSound();

  const allBtns = choicesGrid.querySelectorAll(".choice-btn");
  allBtns.forEach(b => (b.disabled = true));
  btn.classList.add("selected");

  const q = sessionQuestions[currentIndex];
  const isCorrect = opt.isUitan;

  userAnswers.push({
    number: currentIndex + 1,
    kanji: q.kanji,
    selected: opt.text,
    uitan: q.uitan,
    correct: q.correct,
    isCorrect
  });

  setTimeout(() => {
    currentIndex++;
    if (currentIndex < TOTAL_QUESTIONS) {
      isTransitioning = false;
      renderQuestion();
    } else {
      showResult();
    }
  }, 220);
}

function getScoreEvaluation(score) {
  if (score === 100) {
    return {
      tierClass: "tier-100",
      badge: "👑 ういわ～るど完全制覇",
      headline: "満点！！ういたんの脳内と100%完全シンクロ🔥",
      regret: "ここまで読めるなら、もうういわ～るどの住人認定。記念にスクショしておきたいレベル！"
    };
  }
  if (score >= 80) {
    return {
      tierClass: "tier-80",
      badge: "✨ ういわ～るど上級者",
      headline: "あと一歩で満点！！ういたんの思考をかなり読めてる👏",
      regret: "あと1〜2問で満点だったのに…！あの選択肢を変えられていたら満点だったかも？"
    };
  }
  if (score >= 60) {
    return {
      tierClass: "tier-60",
      badge: "🧭 ういわ～るど中級者",
      headline: "半分以上クリア！ういわ～るどの入り口には立ててる！",
      regret: "悪くないけど、もうひと押しで80点台が見えてたはず。ちょっと悔しいライン！"
    };
  }
  if (score >= 40) {
    return {
      tierClass: "tier-40",
      badge: "⚡ 迷走気味",
      headline: "ういたんの自由な発想に振り回され中…！",
      regret: "「こっちかな？」で外した問題が地味に痛い…！常識を捨てきれてなかったかも？"
    };
  }
  if (score >= 20) {
    return {
      tierClass: "tier-20",
      badge: "💦 常識にとらわれすぎ",
      headline: "ういわ～るどのルール、だいぶ見失ってるよ…！",
      regret: "辞書や常識に引っ張られすぎた結果がここに。あのとき逆を選んでいれば…と後悔する点数！"
    };
  }
  return {
    tierClass: "tier-0",
    badge: "💀 ういわ～るど迷子",
    headline: "まさかの大苦戦…！ういたんの解答と真逆を突き進んだ💥",
    regret: "ここまで外すほうが逆にすごい…？もう一度挑戦してリベンジしないと終われない！"
  };
}

function updateXShareLink(score, badge) {
  const tiles = userAnswers.map(a => (a.isCorrect ? "💖" : "🤍")).join("");
  const currentUrl = window.location.href;
  const text = [
    `ういたんの答えを選択しろ‼️ 結果：${score}点（${badge}）`,
    tiles,
    currentUrl
  ].join("\n");
  xShareBtn.href = `https://x.com/intent/tweet?text=${encodeURIComponent(text)}`;
}

function showResult() {
  setTopStartBadgeVisible(false);
  quizScreen.style.display = "none";
  resultScreen.style.display = "block";

  const correctCount = userAnswers.filter(a => a.isCorrect).length;
  const score = correctCount * POINTS_PER_QUESTION;
  const evalData = getScoreEvaluation(score);

  scoreBox.className = `score-box ${evalData.tierClass}`;
  tierBadge.textContent = evalData.badge;
  finalScore.textContent = score;
  rankHeadline.textContent = evalData.headline;
  regretNote.textContent = evalData.regret;

  updateXShareLink(score, evalData.badge);

  resultList.innerHTML = "";

  userAnswers.forEach(item => {
    const div = document.createElement("div");
    div.className = `result-item ${item.isCorrect ? "is-correct" : "is-wrong"}`;

    const badgeClass = item.isCorrect ? "verdict-ok" : "verdict-ng";
    const badgeText = item.isCorrect ? "正解（+10点）" : "不正解（0点）";

    div.innerHTML = `
      <div class="result-top">
        <span class="result-kanji">Q${item.number}. ${item.kanji}</span>
        <span class="verdict-badge ${badgeClass}">${badgeText}</span>
      </div>
      <div class="result-details">
        あなたの選択：<strong>${item.selected}</strong><br>
        ういたんの答え：<strong>${item.uitan}</strong> ／ 辞書の正しい読み：${item.correct}
      </div>
    `;
    resultList.appendChild(div);
  });
}

soundToggle.addEventListener("click", () => {
  soundEnabled = !soundEnabled;
  soundToggle.setAttribute("aria-pressed", String(!soundEnabled));
  soundToggle.textContent = soundEnabled ? "🔊 効果音：ON" : "🔇 効果音：OFF";
  if (soundEnabled) playClickSound();
});

startBtn.addEventListener("click", startGame);
retryBtn.addEventListener("click", startGame);

setTopStartBadgeVisible(true);
</script>
</body>
</html>
