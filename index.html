<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ういたんの答えを選択しろ‼️</title>
<style>
  :root {
    --bg-cream: #fff9fb;
    --bg-card: #ffffff;
    --ink-main: #2d1f26;
    --ink-sub: #7a626c;
    --accent-rose: #ff4d79;
    --accent-rose-dark: #e02b5c;
    --accent-berry: #b8326a;
    --accent-gold: #f5b935;
    --accent-gold-soft: #fff6db;
    --accent-lilac: #f4ecff;
    --border-soft: #f3dce6;
    --ok-bg: #ebfaef;
    --ok-ink: #197c3c;
    --ng-bg: #fff0f4;
    --ng-ink: #c6284f;
    --shadow-card: 0 16px 40px rgba(224, 43, 92, 0.09), 0 4px 14px rgba(45, 31, 38, 0.04);
    --shadow-btn: 0 8px 22px rgba(255, 77, 121, 0.34);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    background-color: var(--bg-cream);
    background-image:
      radial-gradient(circle at 12% 14%, rgba(255, 77, 121, 0.13) 0, transparent 42%),
      radial-gradient(circle at 88% 18%, rgba(245, 185, 53, 0.16) 0, transparent 38%),
      radial-gradient(circle at 82% 86%, rgba(196, 148, 255, 0.16) 0, transparent 44%),
      radial-gradient(circle at 20% 88%, rgba(255, 158, 187, 0.15) 0, transparent 40%);
    color: var(--ink-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 22px 16px 56px;
  }

  .app-header {
    width: 100%;
    max-width: 680px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .brand-tag {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.06em;
    color: var(--accent-rose-dark);
    background: linear-gradient(135deg, #ffffff 0%, #fff0f5 100%);
    border: 1.5px solid #f7cddc;
    padding: 7px 14px;
    border-radius: 999px;
    box-shadow: 0 4px 12px rgba(255, 77, 121, 0.1);
  }

  .brand-tag.is-hidden {
    visibility: hidden;
  }

  .sound-btn {
    font-family: inherit;
    font-size: 12px;
    font-weight: 800;
    color: var(--ink-main);
    background: #fff;
    border: 1.5px solid var(--border-soft);
    padding: 7px 15px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(45, 31, 38, 0.05);
    transition: all 0.16s ease;
  }

  .sound-btn:hover {
    border-color: var(--accent-rose);
    color: var(--accent-rose-dark);
    transform: translateY(-1px);
  }

  .container {
    width: 100%;
    max-width: 680px;
    background: rgba(255, 255, 255, 0.96);
    border: 2px solid #f7dfea;
    border-radius: 28px;
    box-shadow: var(--shadow-card);
    padding: 30px 24px 36px;
    position: relative;
    overflow: hidden;
  }

  .container::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 6px;
    background: linear-gradient(90deg, #ff7aa2, #ffd166, #c792ea, #ff4d79);
  }

  @media (min-width: 600px) {
    .container {
      padding: 38px 40px 42px;
    }
  }

  .start-screen {
    text-align: center;
  }

  .badge-top {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, #fff5d6 0%, #ffe8f0 100%);
    color: #9e4767;
    border: 1.5px solid #f5cde0;
    font-size: 12px;
    font-weight: 800;
    padding: 6px 16px;
    border-radius: 999px;
    margin-bottom: 14px;
    box-shadow: 0 3px 10px rgba(255, 77, 121, 0.08);
  }

  .main-title {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: clamp(25px, 6.2vw, 38px);
    font-weight: 900;
    line-height: 1.32;
    color: var(--ink-main);
    margin-bottom: 22px;
    text-shadow: 0 2px 10px rgba(255, 77, 121, 0.08);
  }

  .rule-box {
    background: linear-gradient(180deg, #fffafd 0%, #fff4f8 100%);
    border: 2px dashed #f3b8cf;
    border-radius: 20px;
    padding: 22px 18px;
    margin-bottom: 28px;
    font-size: 15px;
    line-height: 1.95;
    color: var(--ink-main);
    font-weight: 600;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
  }

  .rule-highlight {
    display: inline-block;
    font-weight: 900;
    font-size: 17px;
    color: var(--accent-rose-dark);
    background: linear-gradient(135deg, #ffe3ec 0%, #fff0c2 100%);
    border: 1px solid #f7bfd3;
    padding: 3px 12px;
    border-radius: 10px;
    margin: 3px 0;
  }

  .primary-btn {
    font-family: inherit;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 0.05em;
    color: #fff;
    background: linear-gradient(135deg, #ff6b95 0%, var(--accent-rose) 52%, var(--accent-rose-dark) 100%);
    border: none;
    border-radius: 999px;
    padding: 16px 40px;
    cursor: pointer;
    box-shadow: var(--shadow-btn);
    transition: transform 0.14s ease, box-shadow 0.14s ease, filter 0.14s ease;
  }

  .primary-btn:hover {
    transform: translateY(-2px) scale(1.01);
    box-shadow: 0 11px 26px rgba(255, 77, 121, 0.42);
    filter: brightness(1.03);
  }

  .primary-btn:active {
    transform: translateY(0) scale(0.99);
  }

  .quiz-screen {
    display: none;
  }

  .progress-wrap {
    margin-bottom: 22px;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: 800;
    color: var(--ink-sub);
    margin-bottom: 8px;
  }

  .q-counter {
    color: var(--accent-rose-dark);
    font-size: 15px;
    background: #fff0f5;
    padding: 3px 11px;
    border-radius: 999px;
    border: 1px solid #f8cde0;
  }

  .progress-bar-bg {
    width: 100%;
    height: 10px;
    background: #f9e6ee;
    border-radius: 999px;
    overflow: hidden;
    padding: 1px;
  }

  .progress-bar-fill {
    height: 100%;
    width: 10%;
    background: linear-gradient(90deg, #ff85a8, #ffd166, #ff4d79);
    border-radius: 999px;
    transition: width 0.25s ease;
  }

  .kanji-stage {
    text-align: center;
    background: linear-gradient(160deg, #fffdfd 0%, #fff2f7 60%, #fef9e7 100%);
    border: 2px solid #f6d5e4;
    border-radius: 22px;
    padding: 30px 18px;
    margin-bottom: 22px;
    box-shadow: 0 8px 20px rgba(255, 77, 121, 0.06);
  }

  .kanji-label {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 800;
    color: #9e4767;
    background: #fff;
    border: 1px solid #f4cadc;
    padding: 3px 12px;
    border-radius: 999px;
    letter-spacing: 0.1em;
    margin-bottom: 10px;
  }

  .kanji-word {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: clamp(32px, 8vw, 48px);
    font-weight: 900;
    color: var(--ink-main);
    line-height: 1.3;
    word-break: break-word;
    text-shadow: 0 2px 8px rgba(45, 31, 38, 0.06);
  }

  .choices-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }

  @media (min-width: 520px) {
    .choices-grid {
      grid-template-columns: 1fr 1fr;
    }
  }

  .choice-btn {
    font-family: inherit;
    font-size: 16px;
    font-weight: 800;
    color: var(--ink-main);
    background: linear-gradient(180deg, #ffffff 0%, #fff9fb 100%);
    border: 2px solid #f2d4e2;
    border-radius: 18px;
    padding: 16px 14px;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 4px 12px rgba(255, 77, 121, 0.06);
    transition: all 0.15s ease;
    min-height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.4;
  }

  .choice-btn:hover:not(:disabled) {
    border-color: var(--accent-rose);
    background: linear-gradient(180deg, #fff5f8 0%, #ffe9f0 100%);
    color: var(--accent-rose-dark);
    transform: translateY(-2px);
    box-shadow: 0 7px 16px rgba(255, 77, 121, 0.16);
  }

  .choice-btn.selected {
    border-color: var(--accent-rose-dark);
    background: linear-gradient(135deg, #ff6b95 0%, var(--accent-rose-dark) 100%);
    color: #fff;
    box-shadow: 0 8px 18px rgba(224, 43, 92, 0.3);
  }

  .result-screen {
    display: none;
  }

  .score-box {
    text-align: center;
    border-radius: 22px;
    padding: 28px 18px;
    margin-bottom: 26px;
  }

  .score-box.tier-100 {
    background: linear-gradient(135deg, #fff7d1 0%, #ffe3f0 48%, #ffd257 100%);
    border: 2.5px solid #e2a21b;
    box-shadow: 0 12px 28px rgba(226, 162, 27, 0.34);
  }

  .score-box.tier-80 {
    background: linear-gradient(160deg, #fffaf0 0%, #fff0f6 55%, #fde8b2 100%);
    border: 2px solid #e5a935;
    box-shadow: 0 9px 22px rgba(229, 169, 53, 0.2);
  }

  .score-box.tier-60 {
    background: linear-gradient(180deg, #fffdfd 0%, #f9f0f5 100%);
    border: 1.5px solid #e3c8d6;
  }

  .score-box.tier-40 {
    background: linear-gradient(180deg, #fff7fa 0%, #fce8ef 100%);
    border: 1.5px solid #eab3c6;
  }

  .score-box.tier-20 {
    background: linear-gradient(180deg, #fff0f4 0%, #fad8e2 100%);
    border: 2px solid #e289a6;
  }

  .score-box.tier-0 {
    background: linear-gradient(180deg, #f5eff3 0%, #e7dce3 100%);
    border: 2px solid #9c8894;
  }

  .tier-badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0.06em;
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 8px;
  }

  .tier-100 .tier-badge { background: #9c5700; color: #fff8dc; }
  .tier-80 .tier-badge { background: #a8542a; color: #fff; }
  .tier-60 .tier-badge { background: #6d5362; color: #fff; }
  .tier-40 .tier-badge { background: #c23561; color: #fff; }
  .tier-20 .tier-badge { background: #a31f49; color: #fff; }
  .tier-0 .tier-badge { background: #382a33; color: #f7f2f5; }

  .score-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-sub);
    margin-bottom: 4px;
  }

  .score-value {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-weight: 900;
    color: var(--accent-rose-dark);
    line-height: 1.2;
  }

  .tier-100 .score-value { font-size: clamp(46px, 12vw, 66px); color: #c91d4e; }
  .tier-80 .score-value { font-size: clamp(42px, 10.5vw, 58px); color: var(--accent-rose-dark); }
  .tier-60 .score-value, .tier-40 .score-value { font-size: clamp(38px, 9.5vw, 52px); }
  .tier-20 .score-value { font-size: clamp(36px, 9vw, 48px); color: #ad1c4a; }
  .tier-0 .score-value { font-size: clamp(36px, 9vw, 48px); color: #564550; }

  .score-unit {
    font-size: 20px;
    font-weight: 700;
    color: var(--ink-main);
    margin-left: 4px;
  }

  .rank-headline {
    margin-top: 10px;
    font-weight: 900;
    color: var(--ink-main);
    line-height: 1.45;
  }

  .tier-100 .rank-headline { font-size: 18px; }
  .tier-80 .rank-headline { font-size: 16px; }
  .tier-60 .rank-headline, .tier-40 .rank-headline { font-size: 15px; }
  .tier-20 .rank-headline, .tier-0 .rank-headline { font-size: 15px; color: #422430; }

  .regret-note {
    margin-top: 10px;
    font-size: 13px;
    line-height: 1.65;
    font-weight: 600;
    color: var(--ink-sub);
    background: rgba(255, 255, 255, 0.78);
    border-radius: 14px;
    padding: 11px 14px;
  }

  .result-list-title {
    font-size: 15px;
    font-weight: 900;
    color: var(--ink-main);
    margin-bottom: 12px;
    padding-left: 12px;
    border-left: 4px solid var(--accent-rose);
  }

  .result-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 28px;
  }

  .result-item {
    border: 1.5px solid #f5dce8;
    border-radius: 16px;
    padding: 14px 16px;
    background: #fff;
    box-shadow: 0 3px 10px rgba(255, 77, 121, 0.04);
  }

  .result-item.is-correct {
    border-left: 5px solid var(--ok-ink);
    background: #f9fefb;
  }

  .result-item.is-wrong {
    border-left: 5px solid var(--ng-ink);
    background: #fff9fb;
  }

  .result-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .result-kanji {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 18px;
    font-weight: 900;
    color: var(--ink-main);
  }

  .verdict-badge {
    font-size: 12px;
    font-weight: 900;
    padding: 3px 11px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .verdict-ok {
    background: var(--ok-bg);
    color: var(--ok-ink);
  }

  .verdict-ng {
    background: var(--ng-bg);
    color: var(--ng-ink);
  }

  .result-details {
    font-size: 13px;
    line-height: 1.65;
    color: var(--ink-sub);
  }

  .result-details strong {
    color: var(--ink-main);
  }

  .retry-wrap {
    text-align: center;
  }

  .share-section {
    background: linear-gradient(180deg, #fffdfd 0%, #fff5f8 100%);
    border: 1.5px solid var(--border-soft);
    border-radius: 20px;
    padding: 20px 18px;
    margin-bottom: 26px;
    text-align: center;
    box-shadow: 0 6px 16px rgba(255, 77, 121, 0.05);
  }

  .share-heading {
    font-size: 13px;
    font-weight: 800;
    color: var(--ink-sub);
    margin-bottom: 12px;
    letter-spacing: 0.04em;
  }

  .x-share-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    font-weight: 800;
    color: #ffffff;
    background: #141416;
    border: none;
    border-radius: 14px;
    padding: 15px 20px;
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(20, 20, 22, 0.2);
    transition: transform 0.14s ease, box-shadow 0.14s ease, opacity 0.14s ease;
  }

  .x-share-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 9px 20px rgba(20, 20, 22, 0.28);
    opacity: 0.96;
  }

  .x-share-btn:active {
    transform: translateY(0);
  }

  .x-mark {
    font-size: 16px;
    line-height: 1;
    font-weight: 900;
  }


  .flash-overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.92) 0%, rgba(255, 224, 236, 0.55) 55%, rgba(255, 255, 255, 0) 100%);
    pointer-events: none;
    opacity: 0;
    z-index: 999;
  }

  .flash-overlay.is-flashing {
    animation: flashBurst 0.34s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes flashBurst {
    0% {
      opacity: 0.95;
      transform: scale(1);
    }
    45% {
      opacity: 0.72;
      transform: scale(1.02);
    }
    100% {
      opacity: 0;
      transform: scale(1.04);
    }
  }

  .container.is-flash-pop {
    animation: containerFlashPop 0.28s ease-out;
  }

  @keyframes containerFlashPop {
    0% {
      transform: scale(0.985);
      box-shadow: 0 0 36px rgba(255, 77, 121, 0.45), var(--shadow-card);
    }
    55% {
      transform: scale(1.008);
    }
    100% {
      transform: scale(1);
      box-shadow: var(--shadow-card);
    }
  }

  .kanji-stage.is-flash-hit {
    animation: stageFlashHit 0.28s ease-out;
  }

  @keyframes stageFlashHit {
    0% {
      filter: brightness(1.35);
      transform: scale(0.97);
    }
    60% {
      filter: brightness(1.12);
      transform: scale(1.015);
    }
    100% {
      filter: brightness(1);
      transform: scale(1);
    }
  }


  /* FLASH golden-era punchy effects */
  .container.is-screen-shake {
    animation: flashScreenShake 0.24s cubic-bezier(0.36, 0.07, 0.19, 0.97);
  }

  @keyframes flashScreenShake {
    0% { transform: translate(0, 0) rotate(0deg); }
    20% { transform: translate(-5px, 3px) rotate(-0.4deg); }
    40% { transform: translate(5px, -3px) rotate(0.4deg); }
    60% { transform: translate(-3px, -2px) rotate(-0.2deg); }
    80% { transform: translate(3px, 2px) rotate(0.2deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  .choice-btn.is-flash-hit {
    animation: choiceFlashHit 0.42s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes choiceFlashHit {
    0% { transform: scale(1); filter: brightness(1); }
    35% { transform: scale(1.06); filter: brightness(1.38); }
    100% { transform: scale(1); filter: brightness(1); }
  }

  .cutin-banner {
    position: fixed;
    top: 22%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.82) skewX(-8deg);
    background: linear-gradient(135deg, #ff3b72 0%, #ff85a8 48%, #ffd166 100%);
    color: #fff;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: clamp(22px, 6vw, 34px);
    font-weight: 900;
    letter-spacing: 0.06em;
    padding: 12px 30px;
    border-radius: 14px;
    border: 3px solid #ffffff;
    box-shadow: 0 12px 30px rgba(224, 43, 92, 0.42), 0 0 24px rgba(255, 209, 102, 0.75);
    pointer-events: none;
    opacity: 0;
    z-index: 1000;
    white-space: nowrap;
  }

  .cutin-banner.is-active {
    animation: flashCutinAnim 0.56s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .cutin-banner.is-start-long {
    animation: flashStartCutinLong 0.96s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes flashStartCutinLong {
    0% {
      opacity: 0;
      transform: translate(-125%, -50%) scale(0.82) skewX(-12deg);
    }
    18% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.08) skewX(-8deg);
    }
    78% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.01) skewX(-8deg);
    }
    100% {
      opacity: 0;
      transform: translate(45%, -50%) scale(0.95) skewX(-6deg);
    }
  }

  @keyframes flashCutinAnim {
    0% {
      opacity: 0;
      transform: translate(-120%, -50%) scale(0.85) skewX(-12deg);
    }
    22% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.06) skewX(-8deg);
    }
    75% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1) skewX(-8deg);
    }
    100% {
      opacity: 0;
      transform: translate(35%, -50%) scale(0.95) skewX(-6deg);
    }
  }


  /* FLASH-style speed lines & particle burst */
  .speed-lines-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 997;
    opacity: 0;
    background: repeating-conic-gradient(
      from 0deg at 50% 50%,
      rgba(255, 77, 121, 0.24) 0deg 2deg,
      rgba(255, 209, 102, 0.16) 2deg 4deg,
      transparent 4deg 14deg
    );
    mask-image: radial-gradient(circle at 50% 50%, transparent 28%, black 75%);
    -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent 28%, black 75%);
  }

  .speed-lines-layer.is-active {
    animation: speedLinesFlash 0.36s ease-out forwards;
  }

  .speed-lines-layer.is-start-long {
    animation: speedLinesStartLong 0.76s ease-out forwards;
  }

  @keyframes speedLinesStartLong {
    0% {
      opacity: 0.95;
      transform: scale(1.18) rotate(0deg);
    }
    60% {
      opacity: 0.72;
      transform: scale(1.04) rotate(6deg);
    }
    100% {
      opacity: 0;
      transform: scale(0.98) rotate(10deg);
    }
  }

  @keyframes speedLinesFlash {
    0% {
      opacity: 0.92;
      transform: scale(1.14) rotate(0deg);
    }
    55% {
      opacity: 0.65;
      transform: scale(1.02) rotate(3deg);
    }
    100% {
      opacity: 0;
      transform: scale(0.96) rotate(5deg);
    }
  }

  .burst-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 998;
    overflow: hidden;
  }

  .burst-spark {
    position: absolute;
    left: var(--x);
    top: var(--y);
    font-size: var(--size, 18px);
    font-weight: 900;
    color: var(--color, #ff4d79);

function setTopStartBadgeVisible(visible) {
  if (!topStartBadge) return;
  topStartBadge.classList.toggle("is-hidden", !visible);
}

function playClickSound() {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(520, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(760, audioCtx.currentTime + 0.07);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
  } catch (_) {}
}

function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}


const flashOverlay = document.getElementById("flashOverlay");

function triggerFlashEffect(targetEl) {
  if (flashOverlay) {
    flashOverlay.classList.remove("is-flashing");
    void flashOverlay.offsetWidth;
    flashOverlay.classList.add("is-flashing");
  }
  if (mainContainer) {
    mainContainer.classList.remove("is-flash-pop");
    void mainContainer.offsetWidth;
    mainContainer.classList.add("is-flash-pop");
  }
  if (targetEl) {
    targetEl.classList.remove("is-flash-hit");
    void targetEl.offsetWidth;
    targetEl.classList.add("is-flash-hit");
  }
}


const cutinBanner = document.getElementById("cutinBanner");

function playTone(freqStart, freqEnd, duration, type = "triangle", volume = 0.14) {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freqStart, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (_) {}
}

function playFlashHitSound(isCorrect) {
  if (isCorrect) {
    playTone(587.33, 1046.5, 0.14, "triangle", 0.16);
  } else {
    playTone(260, 145, 0.16, "sawtooth", 0.11);
  }
}

function spawnBurstSparks(centerX, centerY, isPositive = true) {
  if (!burstLayer) return;
  const symbols = isPositive
    ? ["💖", "✦", "★", "✨", "⚡"]
    : ["💥", "⚡", "✦", "💫"];
  const colors = isPositive
    ? ["#ff4d79", "#f5b935", "#ff85a8", "#b8326a", "#ff9e2c"]
    : ["#c6284f", "#7a626c", "#ff4d79", "#422430"];

  const count = isPositive ? 12 : 8;
  for (let i = 0; i < count; i++) {
    const spark = document.createElement("span");
    spark.className = "burst-spark";
    const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.35;
    const dist = 68 + Math.random() * 88;
    const dx = `${Math.cos(angle) * dist}px`;
    const dy = `${Math.sin(angle) * dist}px`;
    const rot = `${Math.round((Math.random() - 0.5) * 90)}deg`;
    const size = `${15 + Math.round(Math.random() * 10)}px`;

    spark.textContent = symbols[i % symbols.length];
    spark.style.setProperty("--x", `${centerX}px`);
    spark.style.setProperty("--y", `${centerY}px`);
    spark.style.setProperty("--dx", dx);
    spark.style.setProperty("--dy", dy);
    spark.style.setProperty("--rot", rot);
    spark.style.setProperty("--size", size);
    spark.style.setProperty("--color", colors[i % colors.length]);

    burstLayer.appendChild(spark);
    setTimeout(() => spark.remove(), 620);
  }
}

function playResultFanfare(score) {
  if (!soundEnabled) return;
  const notes = score >= 80
    ? [523.25, 659.25, 783.99, 1046.5]
    : score >= 40
      ? [440, 554.37, 659.25]
      : [330, 293.66, 220];
  notes.forEach((freq, idx) => {
    setTimeout(() => {
      playTone(freq, freq * 1.04, 0.16, "triangle", 0.13);
    }, idx * 85);
  });
}


const resultAmbientLayer = document.getElementById("resultAmbientLayer");
let resultLoopInterval = null;

function stopResultLoopEffect() {
  if (resultLoopInterval) {
    clearInterval(resultLoopInterval);
    resultLoopInterval = null;
  }
  if (resultAmbientLayer) {
    resultAmbientLayer.className = "result-ambient-layer";
    resultAmbientLayer.innerHTML = "";
  }
}

function startResultLoopEffect(score) {
  stopResultLoopEffect();
  if (!resultAmbientLayer) return;

  let tierClass = "tier-0";
  let icons = ["💀", "🖤", "💫"];
  let intervalMs = 1400;

  if (score === 100) {
    tierClass = "tier-100";
    icons = ["👑", "💖", "✨", "🌟", "💛"];
    intervalMs = 750;
  } else if (score >= 80) {
    tierClass = "tier-80";
    icons = ["✨", "💛", "★", "💖"];
    intervalMs = 950;
  } else if (score >= 60) {
    tierClass = "tier-60";
    icons = ["💜", "✦", "🌸"];
    intervalMs = 1200;
  } else if (score >= 20) {
    tierClass = "tier-20";
    icons = ["🩷", "⚡", "✦"];
    intervalMs = 1300;
  }

  resultAmbientLayer.className = `result-ambient-layer is-running ${tierClass}`;

  for (let i = 0; i < 10; i++) {
    const el = document.createElement("span");
    el.className = "ambient-floater";
    el.textContent = icons[i % icons.length];
    el.style.setProperty("--fx", `${8 + ((i * 19) % 84)}%`);
    el.style.setProperty("--fy", `${12 + ((i * 23) % 76)}%`);
    el.style.setProperty("--fsize", `${18 + (i % 3) * 6}px`);
    el.style.setProperty("--fdur", `${2.4 + (i % 4) * 0.6}s`);
    resultAmbientLayer.appendChild(el);
  }

  resultLoopInterval = setInterval(() => {
    if (resultScreen.style.display !== "block") {
      stopResultLoopEffect();
      return;
    }
    const rx = window.innerWidth * (0.18 + Math.random() * 0.64);
    const ry = window.innerHeight * (0.16 + Math.random() * 0.42);
    spawnBurstSparks(rx, ry, score >= 40);
  }, intervalMs);
}

function startGame() {
  playClickSound();
  stopResultLoopEffect();
  triggerFlashEffect(mainContainer);
  if (speedLinesLayer) {
    speedLinesLayer.classList.remove("is-active", "is-start-long");
    void speedLinesLayer.offsetWidth;
    speedLinesLayer.classList.add("is-start-long");
  }
  if (cutinBanner) {
    cutinBanner.textContent = "⚡ START!! ⚡";
    cutinBanner.classList.remove("is-active", "is-start-long");
    void cutinBanner.offsetWidth;
    cutinBanner.classList.add("is-start-long");
  }
  spawnBurstSparks(window.innerWidth / 2, window.innerHeight * 0.42, true);
  sessionQuestions = shuffleArray(QUIZ_DATA).slice(0, TOTAL_QUESTIONS).map(item => {
    const options = shuffleArray([
      { text: item.uitan, isUitan: true },
      { text: item.correct, isUitan: false },
      { text: item.w1, isUitan: false },
      { text: item.w2, isUitan: false }
    ]);
    return {
      ...item,
      options
    };
  });
  currentIndex = 0;
  userAnswers = [];
  isTransitioning = false;

  setTopStartBadgeVisible(false);
  startScreen.style.display = "none";
  resultScreen.style.display = "none";
  quizScreen.style.display = "block";
  renderQuestion();
}

function renderQuestion() {
  const q = sessionQuestions[currentIndex];
  qCounter.textContent = `第 ${currentIndex + 1} / ${TOTAL_QUESTIONS} 問`;
  progressBar.style.width = `${((currentIndex + 1) / TOTAL_QUESTIONS) * 100}%`;
  kanjiWord.textContent = q.kanji;
  choicesGrid.innerHTML = "";

  q.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "choice-btn";
    btn.textContent = opt.text;
    btn.addEventListener("click", () => handleSelect(btn, opt));
    choicesGrid.appendChild(btn);
  });
}


function triggerButtonAroundEffect(btn) {
  if (!btn || !choicesGrid) return;
  const gridRect = choicesGrid.getBoundingClientRect();
  const btnRect = btn.getBoundingClientRect();
  const relX = btnRect.left - gridRect.left + btnRect.width / 2;
  const relY = btnRect.top - gridRect.top + btnRect.height / 2;

  const halo = document.createElement("span");
  halo.className = "btn-halo-wave";
  halo.style.setProperty("--bx", `${relX}px`);
  halo.style.setProperty("--by", `${relY}px`);
  halo.style.setProperty("--bw", `${btnRect.width}px`);
  halo.style.setProperty("--bh", `${btnRect.height}px`);
  choicesGrid.appendChild(halo);
  setTimeout(() => halo.remove(), 740);

  const symbols = ["✦", "★", "✨", "💖", "⚡"];
  const colors = ["#ff4d79", "#f5b935", "#ff85a8", "#b8326a", "#ff9e2c"];
  const count = 8;

  for (let i = 0; i < count; i++) {
    const spark = document.createElement("span");
    spark.className = "btn-orbit-spark";
    const angle = (Math.PI * 2 * i) / count + 0.25;
    const rx = btnRect.width * 0.56 + 18;
    const ry = btnRect.height * 0.62 + 14;
    const odx = `${Math.cos(angle) * rx}px`;
    const ody = `${Math.sin(angle) * ry}px`;
    const orot = `${Math.round((Math.random() - 0.5) * 70)}deg`;
    const osize = `${13 + (i % 3) * 3}px`;

    spark.textContent = symbols[i % symbols.length];
    spark.style.setProperty("--ox", `${relX}px`);
    spark.style.setProperty("--oy", `${relY}px`);
    spark.style.setProperty("--odx", odx);
    spark.style.setProperty("--ody", ody);
    spark.style.setProperty("--orot", orot);
    spark.style.setProperty("--osize", osize);
    spark.style.setProperty("--ocolor", colors[i % colors.length]);

    choicesGrid.appendChild(spark);
    setTimeout(() => spark.remove(), 800);
  }
}

function handleSelect(btn, opt) {
  if (isTransitioning) return;
  isTransitioning = true;

  const allBtns = choicesGrid.querySelectorAll(".choice-btn");
  allBtns.forEach(b => (b.disabled = true));
  btn.classList.add("selected");
  btn.classList.add("is-flash-hit");
  triggerButtonAroundEffect(btn);

  const q = sessionQuestions[currentIndex];
  const isCorrect = opt.isUitan;
  playClickSound();

  userAnswers.push({
    number: currentIndex + 1,
    kanji: q.kanji,
    selected: opt.text,
    uitan: q.uitan,
    correct: q.correct,
    isCorrect
  });

  setTimeout(() => {
    currentIndex++;
    if (currentIndex < TOTAL_QUESTIONS) {
      isTransitioning = false;
      renderQuestion();
    } else {
      showResult();
    }
  }, 360);
}

function getScoreEvaluation(score) {
  if (score === 100) {
    return {
      tierClass: "tier-100",
      badge: "👑 ういわ～るど完全制覇",
      headline: "満点！！ういたんの脳内と100%完全シンクロ🔥",
      regret: "ここまで読めるなら、もうういわ～るどの住人認定。記念にスクショしておきたいレベル！"
    };
  }
  if (score >= 80) {
    return {
      tierClass: "tier-80",
      badge: "✨ ういわ～るど上級者",
      headline: "あと一歩で満点！！ういたんの思考をかなり読めてる👏",
      regret: "あと1〜2問で満点だったのに…！あの選択肢を変えられていたら満点だったかも？"
    };
  }
  if (score >= 60) {
    return {
      tierClass: "tier-60",
      badge: "🧭 ういわ～るど中級者",
      headline: "半分以上クリア！ういわ～るどの入り口には立ててる！",
      regret: "悪くないけど、もうひと押しで80点台が見えてたはず。ちょっと悔しいライン！"
    };
  }
  if (score >= 40) {
    return {
      tierClass: "tier-40",
      badge: "⚡ 迷走気味",
      headline: "ういたんの自由な発想に振り回され中…！",
      regret: "「こっちかな？」で外した問題が地味に痛い…！常識を捨てきれてなかったかも？"
    };
  }
  if (score >= 20) {
    return {
      tierClass: "tier-20",
      badge: "💦 常識にとらわれすぎ",
      headline: "ういわ～るどのルール、だいぶ見失ってるよ…！",
      regret: "辞書や常識に引っ張られすぎた結果がここに。あのとき逆を選んでいれば…と後悔する点数！"
    };
  }
  return {
    tierClass: "tier-0",
    badge: "💀 ういわ～るど迷子",
    headline: "まさかの大苦戦…！ういたんの解答と真逆を突き進んだ💥",
    regret: "ここまで外すほうが逆にすごい…？もう一度挑戦してリベンジしないと終われない！"
  };
}


function updateXShareLink(score, badge) {
  const tiles = userAnswers.map(a => (a.isCorrect ? "💖" : "🤍")).join("");
  const currentUrl = window.location.href;
  const text = [
    `ういたんの答えを選択しろ‼️ 結果：${score}点（${badge}）`,
    tiles,
    currentUrl
  ].join("\n");
  xShareBtn.href = `https://x.com/intent/tweet?text=${encodeURIComponent(text)}`;
}



function showResult() {
  setTopStartBadgeVisible(false);
  quizScreen.style.display = "none";
  resultScreen.style.display = "block";

  const correctCount = userAnswers.filter(a => a.isCorrect).length;
  const score = correctCount * POINTS_PER_QUESTION;
  const evalData = getScoreEvaluation(score);

  resultScreen.className = `result-screen ${evalData.tierClass}`;
  scoreBox.className = `score-box ${evalData.tierClass}`;
  tierBadge.textContent = evalData.badge;
  finalScore.textContent = score;
  rankHeadline.textContent = evalData.headline;
  regretNote.textContent = evalData.regret;

  updateXShareLink(score, evalData.badge);
  scoreBox.classList.remove("is-result-flash");
  void scoreBox.offsetWidth;
  scoreBox.classList.add("is-result-flash");
  triggerFlashEffect(scoreBox);
  triggerSpeedLines();
  playResultFanfare(score);
  spawnBurstSparks(window.innerWidth / 2, window.innerHeight * 0.28, score >= 40);
  startResultLoopEffect(score);

  resultList.innerHTML = "";

  userAnswers.forEach(item => {
    const div = document.createElement("div");
    div.className = `result-item ${item.isCorrect ? "is-correct" : "is-wrong"}`;

    const badgeClass = item.isCorrect ? "verdict-ok" : "verdict-ng";
    const badgeText = item.isCorrect ? "正解（+10点）" : "不正解（0点）";

    div.innerHTML = `
      <div class="result-top">
        <span class="result-kanji">Q${item.number}. ${item.kanji}</span>
        <span class="verdict-badge ${badgeClass}">${badgeText}</span>
      </div>
      <div class="result-details">
        あなたの選択：<strong>${item.selected}</strong><br>
        ういたんの答え：<strong>${item.uitan}</strong> ／ 辞書の正しい読み：${item.correct}
      </div>
    `;
    resultList.appendChild(div);
  });
}

soundToggle.addEventListener("click", () => {
  soundEnabled = !soundEnabled;
  soundToggle.setAttribute("aria-pressed", String(!soundEnabled));
  soundToggle.textContent = soundEnabled ? "🔊 効果音：ON" : "🔇 効果音：OFF";
  if (soundEnabled) playClickSound();
});

startBtn.addEventListener("click", startGame);
retryBtn.addEventListener("click", startGame);

setTopStartBadgeVisible(true);
</script>
